    version: ">=1.0.0"
  - name: community.docker
    version: ">=1.0.0"
  - name: community.postgresql
    version: ">=1.0.0"
  - name: community.mysql
    version: ">=1.0.0"
  - name: community.redis
    version: ">=1.0.0"
  - name: community.aws
