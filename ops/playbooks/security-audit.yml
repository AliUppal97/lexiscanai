---
# LexiScan AI - Security Audit Playbook
# Purpose: Automated security audit procedures
# Author: LexiScan AI Platform Team
# Version: 1.0.0

name: "Security Audit"
description: "Automated playbook for security audit procedures"
version: "1.0.0"

# Playbook metadata
metadata:
  author: "LexiScan AI Platform Team"
  created: "2024-12-01"
  updated: "2024-12-01"
  tags: ["security", "audit", "compliance", "automation"]
  priority: "high"

# Playbook variables
variables:
  audit_type: "{{ audit_type | default('') }}"
  audit_scope: "{{ audit_scope | default('') }}"
  compliance_standard: "{{ compliance_standard | default('') }}"
  audit_duration: "{{ audit_duration | default(7) }}"
  audit_frequency: "{{ audit_frequency | default('monthly') }}"
  audit_team: "{{ audit_team | default('security-team') }}"
  audit_tools: "{{ audit_tools | default('') }}"
  audit_report_location: "{{ audit_report_location | default('/reports/security') }}"
  audit_findings_threshold: "{{ audit_findings_threshold | default(10) }}"
  audit_severity_threshold: "{{ audit_severity_threshold | default('high') }}"

# Playbook tasks
tasks:
  - name: "Validate Security Audit Parameters"
    description: "Validate all required security audit parameters"
    type: "validation"
    steps:
      - name: "Check audit type"
        action: "validate"
        condition: "audit_type in ['comprehensive', 'vulnerability', 'compliance', 'penetration', 'code', 'infrastructure']"
        error_message: "Audit type must be comprehensive, vulnerability, compliance, penetration, code, or infrastructure"
      
      - name: "Check audit scope"
        action: "validate"
        condition: "audit_scope in ['full', 'application', 'infrastructure', 'network', 'database', 'api']"
        error_message: "Audit scope must be full, application, infrastructure, network, database, or api"
      
      - name: "Check compliance standard"
        action: "validate"
        condition: "compliance_standard in ['SOC2', 'ISO27001', 'HIPAA', 'GDPR', 'FedRAMP', 'PCI-DSS', 'NIST']"
        error_message: "Compliance standard must be SOC2, ISO27001, HIPAA, GDPR, FedRAMP, PCI-DSS, or NIST"
      
      - name: "Check audit duration"
        action: "validate"
        condition: "audit_duration > 0"
        error_message: "Audit duration must be greater than 0"
      
      - name: "Check audit frequency"
        action: "validate"
        condition: "audit_frequency in ['daily', 'weekly', 'monthly', 'quarterly', 'annually']"
        error_message: "Audit frequency must be daily, weekly, monthly, quarterly, or annually"

  - name: "Prepare Security Audit Environment"
    description: "Prepare environment for security audit"
    type: "preparation"
    steps:
      - name: "Create audit namespace"
        action: "apply"
        resource: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "security-audit"
            labels:
              environment: "security-audit"
              audit-type: "{{ audit_type }}"
              compliance-standard: "{{ compliance_standard }}"
      
      - name: "Create audit configmap"
        action: "apply"
        resource: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "security-audit-config"
            namespace: "security-audit"
          data:
            audit_type: "{{ audit_type }}"
            audit_scope: "{{ audit_scope }}"
            compliance_standard: "{{ compliance_standard }}"
            audit_duration: "{{ audit_duration }}"
            audit_frequency: "{{ audit_frequency }}"
            audit_team: "{{ audit_team }}"
            audit_tools: "{{ audit_tools }}"
            audit_report_location: "{{ audit_report_location }}"
            audit_findings_threshold: "{{ audit_findings_threshold }}"
            audit_severity_threshold: "{{ audit_severity_threshold }}"
      
      - name: "Create audit secrets"
        action: "apply"
        resource: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: "security-audit-secrets"
            namespace: "security-audit"
          type: Opaque
          data:
            audit_token: "{{ base64_encode('security-audit-token') }}"
            report_password: "{{ base64_encode('security-audit-report-password') }}"
            tool_credentials: "{{ base64_encode('security-audit-tool-credentials') }}"

  - name: "Deploy Security Audit Tools"
    description: "Deploy security audit tools"
    type: "deployment"
    steps:
      - name: "Deploy vulnerability scanner"
        action: "apply"
        resource: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "vulnerability-scanner"
            namespace: "security-audit"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "vulnerability-scanner"
            template:
              metadata:
                labels:
                  app: "vulnerability-scanner"
              spec:
                containers:
                - name: "scanner"
                  image: "aquasec/trivy:latest"
                  command: ["trivy"]
                  args:
                    - "server"
                    - "--listen"
                    - "0.0.0.0:8080"
                  ports:
                  - containerPort: 8080
                  resources:
                    requests:
                      cpu: "100m"
                      memory: "256Mi"
                    limits:
                      cpu: "500m"
                      memory: "1Gi"
        condition: "audit_type in ['comprehensive', 'vulnerability', 'infrastructure']"
      
      - name: "Deploy code scanner"
        action: "apply"
        resource: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "code-scanner"
            namespace: "security-audit"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "code-scanner"
            template:
              metadata:
                labels:
                  app: "code-scanner"
              spec:
                containers:
                - name: "scanner"
                  image: "semgrep/semgrep:latest"
                  command: ["semgrep"]
                  args:
                    - "--config=auto"
                    - "--json"
                    - "--output=/reports/code-scan.json"
                    - "/code"
                  volumeMounts:
                  - name: "code-volume"
                    mountPath: "/code"
                  - name: "reports-volume"
                    mountPath: "/reports"
                  resources:
                    requests:
                      cpu: "200m"
                      memory: "512Mi"
                    limits:
                      cpu: "1000m"
                      memory: "2Gi"
                volumes:
                - name: "code-volume"
                  persistentVolumeClaim:
                    claimName: "code-pvc"
                - name: "reports-volume"
                  persistentVolumeClaim:
                    claimName: "reports-pvc"
        condition: "audit_type in ['comprehensive', 'code']"
      
      - name: "Deploy infrastructure scanner"
        action: "apply"
        resource: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "infrastructure-scanner"
            namespace: "security-audit"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "infrastructure-scanner"
            template:
              metadata:
                labels:
                  app: "infrastructure-scanner"
              spec:
                containers:
                - name: "scanner"
                  image: "bridgecrew/checkov:latest"
                  command: ["checkov"]
                  args:
                    - "-d"
                    - "/infrastructure"
                    - "--output"
                    - "json"
                    - "--output-file-path"
                    - "/reports/infrastructure-scan.json"
                  volumeMounts:
                  - name: "infrastructure-volume"
                    mountPath: "/infrastructure"
                  - name: "reports-volume"
                    mountPath: "/reports"
                  resources:
                    requests:
                      cpu: "200m"
                      memory: "512Mi"
                    limits:
                      cpu: "1000m"
                      memory: "2Gi"
                volumes:
                - name: "infrastructure-volume"
                  persistentVolumeClaim:
                    claimName: "infrastructure-pvc"
                - name: "reports-volume"
                  persistentVolumeClaim:
                    claimName: "reports-pvc"
        condition: "audit_type in ['comprehensive', 'infrastructure']"
      
      - name: "Deploy network scanner"
        action: "apply"
        resource: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "network-scanner"
            namespace: "security-audit"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "network-scanner"
            template:
              metadata:
                labels:
                  app: "network-scanner"
              spec:
                containers:
                - name: "scanner"
                  image: "nmap/nmap:latest"
                  command: ["nmap"]
                  args:
                    - "-sS"
                    - "-sV"
                    - "-O"
                    - "-A"
                    - "--script=vuln"
                    - "-oX"
                    - "/reports/network-scan.xml"
                    - "{{ audit_scope }}"
                  volumeMounts:
                  - name: "reports-volume"
                    mountPath: "/reports"
                  resources:
                    requests:
                      cpu: "100m"
                      memory: "256Mi"
                    limits:
                      cpu: "500m"
                      memory: "1Gi"
                volumes:
                - name: "reports-volume"
                  persistentVolumeClaim:
                    claimName: "reports-pvc"
        condition: "audit_type in ['comprehensive', 'network']"

  - name: "Run Security Audit Scans"
    description: "Run security audit scans"
    type: "scanning"
    steps:
      - name: "Run vulnerability scan"
        action: "execute"
        command: "trivy"
        args:
          - "image"
          - "--format"
          - "json"
          - "--output"
          - "/reports/vulnerability-scan.json"
          - "lexiscan/api:latest"
        condition: "audit_type in ['comprehensive', 'vulnerability', 'infrastructure']"
      
      - name: "Run code security scan"
        action: "execute"
        command: "semgrep"
        args:
          - "--config=auto"
          - "--json"
          - "--output=/reports/code-security-scan.json"
          - "/code"
        condition: "audit_type in ['comprehensive', 'code']"
      
      - name: "Run infrastructure security scan"
        action: "execute"
        command: "checkov"
        args:
          - "-d"
          - "/infrastructure"
          - "--output"
          - "json"
          - "--output-file-path"
          - "/reports/infrastructure-security-scan.json"
        condition: "audit_type in ['comprehensive', 'infrastructure']"
      
      - name: "Run network security scan"
        action: "execute"
        command: "nmap"
        args:
          - "-sS"
          - "-sV"
          - "-O"
          - "-A"
          - "--script=vuln"
          - "-oX"
          - "/reports/network-security-scan.xml"
          - "{{ audit_scope }}"
        condition: "audit_type in ['comprehensive', 'network']"
      
      - name: "Run API security scan"
        action: "execute"
        command: "zap"
        args:
          - "-t"
          - "https://api.lexiscan.ai"
          - "-J"
          - "/reports/api-security-scan.json"
        condition: "audit_type in ['comprehensive', 'api']"
      
      - name: "Run database security scan"
        action: "execute"
        command: "sqlmap"
        args:
          - "-u"
          - "https://api.lexiscan.ai/api/users"
          - "--batch"
          - "--output-dir=/reports/database-security-scan"
        condition: "audit_type in ['comprehensive', 'database']"

  - name: "Analyze Security Audit Results"
    description: "Analyze security audit results"
    type: "analysis"
    steps:
      - name: "Parse vulnerability scan results"
        action: "execute"
        command: "python"
        args:
          - "/scripts/parse-vulnerability-scan.py"
          - "--input"
          - "/reports/vulnerability-scan.json"
          - "--output"
          - "/reports/vulnerability-analysis.json"
        condition: "audit_type in ['comprehensive', 'vulnerability', 'infrastructure']"
      
      - name: "Parse code security scan results"
        action: "execute"
        command: "python"
        args:
          - "/scripts/parse-code-scan.py"
          - "--input"
          - "/reports/code-security-scan.json"
          - "--output"
          - "/reports/code-analysis.json"
        condition: "audit_type in ['comprehensive', 'code']"
      
      - name: "Parse infrastructure security scan results"
        action: "execute"
        command: "python"
        args:
          - "/scripts/parse-infrastructure-scan.py"
          - "--input"
          - "/reports/infrastructure-security-scan.json"
          - "--output"
          - "/reports/infrastructure-analysis.json"
        condition: "audit_type in ['comprehensive', 'infrastructure']"
      
      - name: "Parse network security scan results"
        action: "execute"
        command: "python"
        args:
          - "/scripts/parse-network-scan.py"
          - "--input"
          - "/reports/network-security-scan.xml"
          - "--output"
          - "/reports/network-analysis.json"
        condition: "audit_type in ['comprehensive', 'network']"
      
      - name: "Parse API security scan results"
        action: "execute"
        command: "python"
        args:
          - "/scripts/parse-api-scan.py"
          - "--input"
          - "/reports/api-security-scan.json"
          - "--output"
          - "/reports/api-analysis.json"
        condition: "audit_type in ['comprehensive', 'api']"
      
      - name: "Parse database security scan results"
        action: "execute"
        command: "python"
        args:
          - "/scripts/parse-database-scan.py"
          - "--input"
          - "/reports/database-security-scan"
          - "--output"
          - "/reports/database-analysis.json"
        condition: "audit_type in ['comprehensive', 'database']"

  - name: "Generate Security Audit Report"
    description: "Generate comprehensive security audit report"
    type: "reporting"
    steps:
      - name: "Generate executive summary"
        action: "execute"
        command: "python"
        args:
          - "/scripts/generate-executive-summary.py"
          - "--input"
          - "/reports"
          - "--output"
          - "/reports/executive-summary.md"
          - "--compliance"
          - "{{ compliance_standard }}"
      
      - name: "Generate technical report"
        action: "execute"
        command: "python"
        args:
          - "/scripts/generate-technical-report.py"
          - "--input"
          - "/reports"
          - "--output"
          - "/reports/technical-report.md"
          - "--compliance"
          - "{{ compliance_standard }}"
      
      - name: "Generate compliance report"
        action: "execute"
        command: "python"
        args:
          - "/scripts/generate-compliance-report.py"
          - "--input"
          - "/reports"
          - "--output"
          - "/reports/compliance-report.md"
          - "--compliance"
          - "{{ compliance_standard }}"
      
      - name: "Generate remediation plan"
        action: "execute"
        command: "python"
        args:
          - "/scripts/generate-remediation-plan.py"
          - "--input"
          - "/reports"
          - "--output"
          - "/reports/remediation-plan.md"
          - "--compliance"
          - "{{ compliance_standard }}"
      
      - name: "Generate risk assessment"
        action: "execute"
        command: "python"
        args:
          - "/scripts/generate-risk-assessment.py"
          - "--input"
          - "/reports"
          - "--output"
          - "/reports/risk-assessment.md"
          - "--compliance"
          - "{{ compliance_standard }}"

  - name: "Validate Security Audit Results"
    description: "Validate security audit results"
    type: "validation"
    steps:
      - name: "Check vulnerability scan results"
        action: "validate"
        condition: "vulnerability_scan_completed == true"
        error_message: "Vulnerability scan did not complete successfully"
        condition: "audit_type in ['comprehensive', 'vulnerability', 'infrastructure']"
      
      - name: "Check code security scan results"
        action: "validate"
        condition: "code_scan_completed == true"
        error_message: "Code security scan did not complete successfully"
        condition: "audit_type in ['comprehensive', 'code']"
      
      - name: "Check infrastructure security scan results"
        action: "validate"
        condition: "infrastructure_scan_completed == true"
        error_message: "Infrastructure security scan did not complete successfully"
        condition: "audit_type in ['comprehensive', 'infrastructure']"
      
      - name: "Check network security scan results"
        action: "validate"
        condition: "network_scan_completed == true"
        error_message: "Network security scan did not complete successfully"
        condition: "audit_type in ['comprehensive', 'network']"
      
      - name: "Check API security scan results"
        action: "validate"
        condition: "api_scan_completed == true"
        error_message: "API security scan did not complete successfully"
        condition: "audit_type in ['comprehensive', 'api']"
      
      - name: "Check database security scan results"
        action: "validate"
        condition: "database_scan_completed == true"
        error_message: "Database security scan did not complete successfully"
        condition: "audit_type in ['comprehensive', 'database']"

  - name: "Send Security Audit Notification"
    description: "Send notification about security audit completion"
    type: "email"
    steps:
      - name: "Send security audit success notification"
        action: "send"
        template: "security-audit-success"
        to: "admin@lexiscan.ai,security@lexiscan.ai"
        subject: "Security Audit Completed - {{ audit_type }}"
        variables:
          audit_type: "{{ audit_type }}"
          audit_scope: "{{ audit_scope }}"
          compliance_standard: "{{ compliance_standard }}"
          completion_time: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          audit_duration: "{{ audit_duration }}"
          audit_frequency: "{{ audit_frequency }}"
          audit_team: "{{ audit_team }}"
          audit_report_location: "{{ audit_report_location }}"
          audit_findings_threshold: "{{ audit_findings_threshold }}"
          audit_severity_threshold: "{{ audit_severity_threshold }}"
      
      - name: "Send security audit failure notification"
        action: "send"
        template: "security-audit-failure"
        to: "admin@lexiscan.ai,security@lexiscan.ai"
        subject: "Security Audit Failed - {{ audit_type }}"
        variables:
          audit_type: "{{ audit_type }}"
          audit_scope: "{{ audit_scope }}"
          compliance_standard: "{{ compliance_standard }}"
          failure_time: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          error_message: "Security audit failed. Please check the logs."
        condition: "security_audit_failed == true"

  - name: "Schedule Next Security Audit"
    description: "Schedule next security audit"
    type: "scheduling"
    steps:
      - name: "Schedule next security audit"
        action: "schedule"
        cron: "{{ audit_frequency }}"
        playbook: "security-audit.yml"
        variables:
          audit_type: "{{ audit_type }}"
          audit_scope: "{{ audit_scope }}"
          compliance_standard: "{{ compliance_standard }}"
          audit_duration: "{{ audit_duration }}"
          audit_frequency: "{{ audit_frequency }}"
          audit_team: "{{ audit_team }}"
          audit_tools: "{{ audit_tools }}"
          audit_report_location: "{{ audit_report_location }}"
          audit_findings_threshold: "{{ audit_findings_threshold }}"
          audit_severity_threshold: "{{ audit_severity_threshold }}"

# Playbook completion
completion:
  success_message: "Security audit completed successfully"
  failure_message: "Security audit failed. Please check the logs and retry"
  next_steps:
    - "Review security audit report"
    - "Implement remediation plan"
    - "Schedule next security audit"
    - "Update security policies"

# Playbook rollback
rollback:
  description: "Rollback security audit if needed"
  steps:
    - name: "Stop security audit tools"
      action: "kubectl"
      command: "delete"
      args:
        - "namespace"
        - "security-audit"
    
    - name: "Clean up security audit resources"
      action: "kubectl"
      command: "delete"
      args:
        - "pvc"
        - "-n"
        - "security-audit"
    
    - name: "Notify of rollback"
      action: "send"
      template: "security-audit-rollback"
      to: "admin@lexiscan.ai,security@lexiscan.ai"
      subject: "Security Audit Rollback - {{ audit_type }}"
      variables:
        audit_type: "{{ audit_type }}"
        rollback_time: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        support_email: "support@lexiscan.ai"
