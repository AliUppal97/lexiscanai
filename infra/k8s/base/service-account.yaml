---
# Service Account for LexiScan AI API
#
# Purpose:
# - Provides identity for API pods
# - Used for authenticating with Kubernetes API and cloud providers
# - Enables workload identity/IAM roles for service accounts
#
# Security Benefits:
# - Principle of least privilege
# - Separate identities for different services
# - Auditable actions per service
# - Cloud provider IAM integration

apiVersion: v1
kind: ServiceAccount
metadata:
  name: lexiscan-api-sa
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
  annotations:
    # AWS IAM Role for Service Account (IRSA)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lexiscan-api-role
    # GCP Workload Identity
    iam.gke.io/gcp-service-account: lexiscan-api@PROJECT_ID.iam.gserviceaccount.com
    # Azure Workload Identity
    azure.workload.identity/client-id: CLIENT_ID
imagePullSecrets:
- name: registry-credentials
automountServiceAccountToken: true

---
# Service Account for Web Application
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lexiscan-web-sa
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: web
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lexiscan-web-role
imagePullSecrets:
- name: registry-credentials
automountServiceAccountToken: false  # Web doesn't need K8s API access

---
# Service Account for AI Worker
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lexiscan-worker-sa
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: worker
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lexiscan-worker-role
imagePullSecrets:
- name: registry-credentials
automountServiceAccountToken: true

---
# Service Account for PDF Generator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lexiscan-pdf-generator-sa
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: pdf-generator
imagePullSecrets:
- name: registry-credentials
automountServiceAccountToken: false

---
# Service Account for Monitoring (Prometheus)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
automountServiceAccountToken: true

---
# Service Account for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/external-secrets-role
automountServiceAccountToken: true

---
# ClusterRole for API Service
# Defines permissions at cluster level
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lexiscan-api-role
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
rules:
# Read-only access to nodes (for health checks)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
# Access to ConfigMaps and Secrets in own namespace
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Access to service endpoints
- apiGroups: [""]
  resources: ["endpoints", "services"]
  verbs: ["get", "list", "watch"]

---
# Role for API Service (Namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lexiscan-api-role
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
rules:
# ConfigMaps and Secrets
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
# Pods (for health checks and metrics)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
# Events (for logging)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
# RoleBinding for API Service
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lexiscan-api-rolebinding
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lexiscan-api-role
subjects:
- kind: ServiceAccount
  name: lexiscan-api-sa
  namespace: lexiscan-ai

---
# ClusterRoleBinding for API Service
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lexiscan-api-clusterrolebinding
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lexiscan-api-role
subjects:
- kind: ServiceAccount
  name: lexiscan-api-sa
  namespace: lexiscan-ai

---
# ClusterRole for Prometheus Monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-role
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
rules:
# Access to all resources for monitoring
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
# Access to metrics endpoints
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
# Non-resource URLs
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs: ["get"]
# Extensions
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-clusterrolebinding
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-role
subjects:
- kind: ServiceAccount
  name: prometheus-sa
  namespace: lexiscan-ai

---
# ClusterRole for External Secrets Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-role
  labels:
    app.kubernetes.io/name: external-secrets
rules:
# Access to ExternalSecret CRDs
- apiGroups: ["external-secrets.io"]
  resources:
  - externalsecrets
  - secretstores
  - clustersecretstores
  verbs: ["get", "list", "watch"]
# Access to Secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Access to ConfigMaps
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# Access to Events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
# ClusterRoleBinding for External Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-clusterrolebinding
  labels:
    app.kubernetes.io/name: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-role
subjects:
- kind: ServiceAccount
  name: external-secrets-sa
  namespace: lexiscan-ai

---
# Role for Worker Service
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lexiscan-worker-role
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: worker
rules:
# ConfigMaps (for dynamic configuration)
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# Secrets (for accessing credentials)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
# Pods (for job management)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Jobs (for creating background jobs)
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# RoleBinding for Worker Service
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lexiscan-worker-rolebinding
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lexiscan-worker-role
subjects:
- kind: ServiceAccount
  name: lexiscan-worker-sa
  namespace: lexiscan-ai

---
# PodSecurityPolicy Binding
# Binds the PSP to service accounts
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: psp-lexiscan-ai
  namespace: lexiscan-ai
rules:
- apiGroups: ["policy"]
  resources: ["podsecuritypolicies"]
  verbs: ["use"]
  resourceNames:
  - lexiscan-ai-psp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: psp-lexiscan-ai
  namespace: lexiscan-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: psp-lexiscan-ai
subjects:
# All service accounts in namespace
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: system:serviceaccounts:lexiscan-ai

---
# BEST PRACTICES FOR SERVICE ACCOUNTS:
#
# 1. Principle of Least Privilege:
#    - Grant only necessary permissions
#    - Use namespace-scoped Roles over ClusterRoles when possible
#    - Regularly audit and remove unused permissions
#
# 2. Separate Service Accounts:
#    - Create dedicated SA for each service
#    - Never share service accounts between services
#    - Use different SAs for different environments
#
# 3. Disable Auto-mounting:
#    - Set automountServiceAccountToken: false when not needed
#    - Reduces attack surface
#    - Prevents accidental exposure of tokens
#
# 4. Cloud Provider Integration:
#    - Use Workload Identity (GKE) or IRSA (EKS)
#    - Avoid static credentials
#    - Rotate IAM role credentials automatically
#
# 5. Token Management:
#    - Use projected volumes for tokens
#    - Set appropriate token expiration
#    - Implement token rotation
#
# 6. Monitoring and Auditing:
#    - Enable audit logging for SA operations
#    - Monitor SA token usage
#    - Alert on suspicious SA activity
#
# 7. Image Pull Secrets:
#    - Attach to service accounts, not individual pods
#    - Use registry mirrors when possible
#    - Implement image scanning in CI/CD

