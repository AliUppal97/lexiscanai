---
# Application Configuration ConfigMap
# 
# Purpose:
# - Stores non-sensitive configuration data for LexiScan AI services
# - Allows configuration changes without rebuilding container images
# - Centralizes environment-specific settings
#
# Security Note:
# - DO NOT store sensitive data (passwords, API keys) here
# - Use Secrets for sensitive configuration instead
# - All values here are visible in plain text

apiVersion: v1
kind: ConfigMap
metadata:
  name: lexiscan-ai-config
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: configuration
data:
  # Application Environment
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  
  # API Configuration
  API_PORT: "3000"
  API_HOST: "0.0.0.0"
  API_BASE_URL: "https://api.lexiscan.ai"
  API_VERSION: "v1"
  
  # Web Application Configuration
  WEB_PORT: "3001"
  WEB_HOST: "0.0.0.0"
  NEXT_PUBLIC_API_URL: "https://api.lexiscan.ai"
  
  # Database Configuration (non-sensitive parts)
  DB_HOST: "postgres-service.lexiscan-ai.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "lexiscan_production"
  DB_SSL_MODE: "require"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_IDLE_TIMEOUT: "10000"
  
  # Redis Configuration
  REDIS_HOST: "redis-service.lexiscan-ai.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_KEY_PREFIX: "lexiscan:"
  REDIS_CONNECT_TIMEOUT: "10000"
  
  # JWT Configuration (non-sensitive)
  JWT_EXPIRES_IN: "7d"
  JWT_REFRESH_EXPIRES_IN: "30d"
  JWT_ALGORITHM: "HS256"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_MS: "900000"  # 15 minutes
  RATE_LIMIT_MAX_REQUESTS: "100"
  
  # CORS Configuration
  CORS_ENABLED: "true"
  CORS_ORIGIN: "https://lexiscan.ai,https://app.lexiscan.ai"
  CORS_CREDENTIALS: "true"
  
  # File Upload Configuration
  MAX_FILE_SIZE: "104857600"  # 100MB in bytes
  ALLOWED_FILE_TYPES: "pdf,doc,docx,txt"
  UPLOAD_TIMEOUT: "300000"  # 5 minutes
  
  # Storage Configuration (non-sensitive)
  STORAGE_PROVIDER: "s3"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "lexiscan-documents-prod"
  
  # Email Configuration (non-sensitive)
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_FROM: "noreply@lexiscan.ai"
  SMTP_FROM_NAME: "LexiScan AI"
  
  # Stripe Configuration (non-sensitive)
  STRIPE_API_VERSION: "2023-10-16"
  STRIPE_CURRENCY: "usd"
  
  # Feature Flags
  ENABLE_WEBHOOKS: "true"
  ENABLE_ANALYTICS: "true"
  ENABLE_CACHING: "true"
  ENABLE_QUEUE: "true"
  ENABLE_NOTIFICATIONS: "true"
  
  # Monitoring & Observability
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
  
  # Queue Configuration
  QUEUE_CONCURRENCY: "5"
  QUEUE_MAX_RETRY: "3"
  QUEUE_RETRY_DELAY: "5000"
  
  # Cache TTL (Time To Live)
  CACHE_TTL_DEFAULT: "3600"  # 1 hour
  CACHE_TTL_USER_SESSION: "86400"  # 24 hours
  CACHE_TTL_DOCUMENTS: "7200"  # 2 hours
  
  # Webhook Configuration
  WEBHOOK_TIMEOUT: "30000"  # 30 seconds
  WEBHOOK_RETRY_ATTEMPTS: "3"
  WEBHOOK_RETRY_DELAY: "1000"  # 1 second
  
  # Document Processing
  PDF_MAX_PAGES: "500"
  OCR_ENABLED: "true"
  TEXT_EXTRACTION_TIMEOUT: "120000"  # 2 minutes
  
  # Audit Logging
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_RETENTION_DAYS: "365"
  
  # Session Configuration
  SESSION_COOKIE_NAME: "lexiscan_session"
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTP_ONLY: "true"
  SESSION_COOKIE_SAME_SITE: "strict"
  
  # Security Headers
  HELMET_ENABLED: "true"
  CSP_ENABLED: "true"
  HSTS_ENABLED: "true"
  
  # Multi-tenancy
  TENANT_ISOLATION_ENABLED: "true"
  DEFAULT_TENANT: "default"

---
# Nginx Configuration for Web Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 2048;
      use epoll;
      multi_accept on;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      # Logging
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

      access_log /var/log/nginx/access.log main;

      # Performance
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;
      client_max_body_size 100M;

      # Gzip Compression
      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 6;
      gzip_types text/plain text/css text/xml text/javascript 
                 application/json application/javascript application/xml+rss 
                 application/rss+xml font/truetype font/opentype 
                 application/vnd.ms-fontobject image/svg+xml;

      # Security Headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "no-referrer-when-downgrade" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

      # Rate Limiting
      limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
      limit_conn_zone $binary_remote_addr zone=addr:10m;

      # Upstream for Next.js
      upstream nextjs_backend {
        server localhost:3000;
        keepalive 32;
      }

      server {
        listen 80;
        server_name _;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr 10;

        # Health check endpoint
        location /health {
          access_log off;
          return 200 "healthy\n";
          add_header Content-Type text/plain;
        }

        # Proxy to Next.js
        location / {
          proxy_pass http://nextjs_backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_cache_bypass $http_upgrade;
          proxy_read_timeout 300s;
          proxy_connect_timeout 75s;
        }

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
          proxy_pass http://nextjs_backend;
          expires 1y;
          add_header Cache-Control "public, immutable";
        }
      }
    }

---
# Prometheus Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

    # Alerting configuration
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093

    # Scrape configurations
    scrape_configs:
    # Kubernetes API Server
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

    # Kubernetes Nodes
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

    # LexiScan AI API
    - job_name: 'lexiscan-api'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - lexiscan-ai
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: api
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

    # PostgreSQL Exporter
    - job_name: 'postgres'
      static_configs:
      - targets: ['postgres-exporter:9187']

    # Redis Exporter
    - job_name: 'redis'
      static_configs:
      - targets: ['redis-exporter:9121']

---
# Application Logging Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-config
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: logging
data:
  log-format.json: |
    {
      "timestamp": true,
      "level": "info",
      "prettyPrint": false,
      "colorize": false,
      "messageFormat": "{timestamp} [{level}] {message}",
      "errorLikeObjectKeys": ["err", "error"],
      "redact": {
        "paths": ["password", "token", "apiKey", "secret"],
        "censor": "[REDACTED]"
      }
    }

