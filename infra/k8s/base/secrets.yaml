---
# Kubernetes Secrets for LexiScan AI
#
# IMPORTANT SECURITY NOTES:
# 1. This file contains BASE64-encoded values, NOT plain text
# 2. NEVER commit actual secrets to version control
# 3. Use external secret management (Sealed Secrets, Vault, AWS Secrets Manager)
# 4. Rotate secrets regularly (every 90 days minimum)
# 5. Use RBAC to restrict access to secrets
# 6. Enable encryption at rest for etcd
#
# To create base64 encoded values:
# echo -n 'your-secret-value' | base64
#
# To decode:
# echo 'base64-encoded-value' | base64 -d
#
# PRODUCTION DEPLOYMENT:
# Replace all CHANGEME values with actual secrets before applying
# Consider using SealedSecrets or External Secrets Operator

apiVersion: v1
kind: Secret
metadata:
  name: lexiscan-ai-secrets
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Database Credentials
  # Format: postgresql://username:password@host:port/database
  DATABASE_URL: Q0hBTkdFTUUtcG9zdGdyZXNxbDovL2xleGlzY2FuOnBhc3N3b3JkQHBvc3RncmVzOjU0MzIvbGV4aXNjYW4=
  DB_PASSWORD: Q0hBTkdFTUUtZGJwYXNzd29yZA==
  
  # Redis Password
  REDIS_PASSWORD: Q0hBTkdFTUUtcmVkaXNwYXNzd29yZA==
  
  # JWT Secrets
  # Generate with: openssl rand -base64 32
  JWT_SECRET: Q0hBTkdFTUUtand0c2VjcmV0a2V5Zm9ycHJvZHVjdGlvbg==
  JWT_REFRESH_SECRET: Q0hBTkdFTUUtand0cmVmcmVzaHNlY3JldGtleQ==
  
  # Encryption Keys
  # Generate with: openssl rand -base64 32
  ENCRYPTION_KEY: Q0hBTkdFTUUtMzJieXRlZW5jcnlwdGlvbmtleQ==
  
  # RSA Keys for Asymmetric Encryption
  # Generate with: openssl genrsa -out private.pem 4096
  # Then: cat private.pem | base64 -w 0
  RSA_PRIVATE_KEY: Q0hBTkdFTUUtcnNhcHJpdmF0ZWtleQ==
  RSA_PUBLIC_KEY: Q0hBTkdFTUUtcnNhcHVibGlja2V5
  
  # AWS Credentials
  AWS_ACCESS_KEY_ID: Q0hBTkdFTUUtYXdzYWNjZXNza2V5aWQ=
  AWS_SECRET_ACCESS_KEY: Q0hBTkdFTUUtYXdzc2VjcmV0YWNjZXNza2V5
  
  # Stripe API Keys
  # Use test keys for non-production: sk_test_... and pk_test_...
  # Production keys: sk_live_... and pk_live_...
  STRIPE_SECRET_KEY: Q0hBTkdFTUUtc2tfdGVzdF9zdHJpcGVzZWNyZXRrZXk=
  STRIPE_PUBLISHABLE_KEY: Q0hBTkdFTUUtcGtfdGVzdF9zdHJpcGVwdWJsaWNrZXk=
  STRIPE_WEBHOOK_SECRET: Q0hBTkdFTUUtd2hzZWNfc3RyaXBld2ViaG9va3NlY3JldA==
  
  # SMTP Credentials
  SMTP_USER: Q0hBTkdFTUUtc210cHVzZXJAZXhhbXBsZS5jb20=
  SMTP_PASSWORD: Q0hBTkdFTUUtc210cHBhc3N3b3Jk
  
  # SendGrid API Key (if using SendGrid)
  SENDGRID_API_KEY: Q0hBTkdFTUUtc2VuZGdyaWRhcGlrZXk=
  
  # OAuth Credentials (if using social login)
  GOOGLE_CLIENT_ID: Q0hBTkdFTUUtZ29vZ2xlY2xpZW50aWQ=
  GOOGLE_CLIENT_SECRET: Q0hBTkdFTUUtZ29vZ2xlY2xpZW50c2VjcmV0
  
  # Session Secret
  SESSION_SECRET: Q0hBTkdFTUUtc2Vzc2lvbnNlY3JldGtleQ==
  
  # API Keys for External Services
  OPENAI_API_KEY: Q0hBTkdFTUUtb3BlbmFpYXBpa2V5
  
  # Webhook Signing Secret
  WEBHOOK_SIGNING_SECRET: Q0hBTkdFTUUtd2ViaG9va3NpZ25pbmdzZWNyZXQ=
  
  # Sentry DSN (for error tracking)
  SENTRY_DSN: Q0hBTkdFTUUtc2VudHJ5ZHNu
  
  # Database Encryption Key
  DB_ENCRYPTION_KEY: Q0hBTkdFTUUtZGJlbmNyeXB0aW9ua2V5

---
# TLS Certificate Secret
# Used for HTTPS/TLS termination
# Generate with Let's Encrypt or your certificate provider
apiVersion: v1
kind: Secret
metadata:
  name: lexiscan-tls-cert
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # TLS certificate (PEM format, base64 encoded)
  tls.crt: Q0hBTkdFTUUtdGxzY2VydGlmaWNhdGU=
  # TLS private key (PEM format, base64 encoded)
  tls.key: Q0hBTkdFTUUtdGxzcHJpdmF0ZWtleQ==

---
# Docker Registry Secret
# For pulling images from private container registries
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
data:
  # Docker config JSON (base64 encoded)
  # Create with: kubectl create secret docker-registry registry-credentials \
  #   --docker-server=your-registry.io \
  #   --docker-username=your-username \
  #   --docker-password=your-password \
  #   --docker-email=your-email@example.com \
  #   --dry-run=client -o yaml
  .dockerconfigjson: Q0hBTkdFTUUtZG9ja2VyY29uZmlnanNvbg==

---
# PostgreSQL Admin Secret
# Separate secret for database administration
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin-secret
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
data:
  POSTGRES_USER: bGV4aXNjYW4=  # lexiscan
  POSTGRES_PASSWORD: Q0hBTkdFTUUtcG9zdGdyZXNwYXNzd29yZA==
  POSTGRES_DB: bGV4aXNjYW5fcHJvZHVjdGlvbg==  # lexiscan_production
  POSTGRES_REPLICATION_PASSWORD: Q0hBTkdFTUUtcmVwbGljYXRpb25wYXNzd29yZA==

---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
type: Opaque
data:
  REDIS_PASSWORD: Q0hBTkdFTUUtcmVkaXNwYXNzd29yZA==

---
# Grafana Admin Secret
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: lexiscan-ai
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
type: Opaque
data:
  GF_SECURITY_ADMIN_USER: YWRtaW4=  # admin
  GF_SECURITY_ADMIN_PASSWORD: Q0hBTkdFTUUtZ3JhZmFuYXBhc3N3b3Jk
  GF_DATABASE_PASSWORD: Q0hBTkdFTUUtZ3JhZmFuYWRicGFzc3dvcmQ=

---
# INSTRUCTIONS FOR PRODUCTION DEPLOYMENT
# 
# 1. Create actual secrets using Kubernetes CLI:
#
#    kubectl create secret generic lexiscan-ai-secrets \
#      --from-literal=DATABASE_URL='postgresql://...' \
#      --from-literal=JWT_SECRET='your-jwt-secret' \
#      --from-literal=STRIPE_SECRET_KEY='sk_live_...' \
#      --namespace=lexiscan-ai
#
# 2. Or use Sealed Secrets (recommended):
#
#    # Install Sealed Secrets controller
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.18.0/controller.yaml
#
#    # Create sealed secret
#    kubectl create secret generic lexiscan-ai-secrets \
#      --from-literal=DATABASE_URL='postgresql://...' \
#      --dry-run=client -o yaml | \
#      kubeseal -o yaml > sealed-secret.yaml
#
#    # Apply sealed secret
