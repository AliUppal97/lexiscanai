---
# AlertManager for LexiScan AI
#
# Purpose:
# - Handles alerts from Prometheus
# - Groups and routes alerts
# - Sends notifications (email, Slack, PagerDuty)
# - Deduplicates alerts
#
# Features:
# - Alert routing
# - Silencing and inhibition
# - High availability
# - Webhook integration

apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  namespace: lexiscan-ai
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  ports:
  - name: web
    port: 9093
    targetPort: 9093
  selector:
    app: alertmanager

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: lexiscan-ai
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.sendgrid.net:587'
      smtp_from: 'alerts@lexiscan.ai'
      smtp_auth_username: 'apikey'
      smtp_auth_password: 'CHANGEME'
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
      - match:
          severity: critical
        receiver: 'pagerduty'
      - match:
          severity: warning
        receiver: 'slack'
    
    receivers:
    - name: 'default'
      email_configs:
      - to: 'ops@lexiscan.ai'
    
    - name: 'slack'
      slack_configs:
      - api_url: 'CHANGEME'
        channel: '#alerts'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    
    - name: 'pagerduty'
      pagerduty_configs:
      - service_key: 'CHANGEME'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-deployment
  namespace: lexiscan-ai
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  
  template:
    metadata:
      labels:
        app: alertmanager
    
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        imagePullPolicy: IfNotPresent
        
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        
        ports:
        - name: web
          containerPort: 9093
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-data
          mountPath: /alertmanager
      
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
      - name: alertmanager-data
        emptyDir: {}

