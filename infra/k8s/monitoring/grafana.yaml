---
# Grafana Deployment for LexiScan AI
#
# Purpose:
# - Visualize metrics from Prometheus
# - Create dashboards for monitoring
# - Alert visualization
#
# Features:
# - Pre-configured dashboards
# - Data source integration
# - User management
# - Dashboard provisioning

apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: lexiscan-ai
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - name: web
    port: 3000
    targetPort: 3000
  selector:
    app: grafana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: lexiscan-ai
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  
  template:
    metadata:
      labels:
        app: grafana
    
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: web
          containerPort: 3000
        
        envFrom:
        - secretRef:
            name: grafana-secret
        
        env:
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana.lexiscan.ai"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        
        livenessProbe:
          httpGet:
            path: /api/health
            port: web
          initialDelaySeconds: 60
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: web
          initialDelaySeconds: 30
          periodSeconds: 5
        
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
      
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data-pvc

