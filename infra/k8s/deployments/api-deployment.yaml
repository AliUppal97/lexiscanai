---
# LexiScan AI API Deployment
#
# Purpose:
# - Deploys the NestJS API backend
# - Handles all business logic and data processing
# - Provides REST API for frontend and external integrations
#
# Features:
# - High availability with multiple replicas
# - Horizontal Pod Autoscaling based on CPU/memory
# - Health checks (liveness and readiness probes)
# - Resource limits and requests
# - Anti-affinity for resilience
# - Rolling updates with zero downtime

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: lexiscan-ai
  labels:
    app: api
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: lexiscan-ai
    app.kubernetes.io/version: "1.0.0"
spec:
  # Number of replicas
  replicas: 3
  
  # Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Maximum number of pods above desired count
      maxUnavailable: 1  # Maximum number of pods that can be unavailable
  
  # Revision history limit
  revisionHistoryLimit: 10
  
  # Selector for pods
  selector:
    matchLabels:
      app: api
      app.kubernetes.io/name: lexiscan-ai
      app.kubernetes.io/component: api
  
  # Pod template
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: lexiscan-ai
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Prometheus scraping annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        # Force pod restart on configmap/secret change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    
    spec:
      # Service account
      serviceAccountName: lexiscan-api-sa
      
      # Security context (pod level)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Anti-affinity for high availability
      # Ensures pods are spread across different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
        
        # Node affinity (optional - for specific node types)
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: workload-type
                operator: In
                values:
                - application
      
      # Topology spread constraints
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: api
      
      # Init containers
      initContainers:
      # Database migration init container
      - name: db-migration
        image: lexiscan/api:latest
        command: ['npm', 'run', 'migrate:deploy']
        envFrom:
        - configMapRef:
            name: lexiscan-ai-config
        - secretRef:
            name: lexiscan-ai-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      
      # Main application container
      containers:
      - name: api
        image: lexiscan/api:latest
        imagePullPolicy: IfNotPresent
        
        # Container security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Ports
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: lexiscan-ai-config
        - secretRef:
            name: lexiscan-ai-secrets
        
        # Additional environment variables
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        # Resource requests and limits
        resources:
          requests:
            cpu: 500m      # 0.5 CPU cores
            memory: 1Gi    # 1 GB RAM
          limits:
            cpu: 2000m     # 2 CPU cores
            memory: 4Gi    # 4 GB RAM
        
        # Liveness probe
        # Checks if container is running and healthy
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness probe
        # Checks if container is ready to accept traffic
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Startup probe
        # Gives container time to start before liveness checks
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30  # 5 minutes to start
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
        - name: logs
          mountPath: /app/logs
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      
      # Restart policy
      restartPolicy: Always
      
      # Termination grace period
      terminationGracePeriodSeconds: 60
      
      # Image pull secrets
      imagePullSecrets:
      - name: registry-credentials

---
# Horizontal Pod Autoscaler for API
# Automatically scales pods based on CPU and memory usage
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: lexiscan-ai
  labels:
    app: api
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment
  
  # Scaling parameters
  minReplicas: 3
  maxReplicas: 20
  
  # Metrics for scaling decisions
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale when avg CPU > 70%
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Scale when avg memory > 80%
  
  # Custom metrics (if using custom metrics API)
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "1000"
  
  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max

---
# Pod Disruption Budget
# Ensures minimum availability during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: lexiscan-ai
  labels:
    app: api
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: api
spec:
  minAvailable: 2  # Always keep at least 2 pods running
  selector:
    matchLabels:
      app: api
      app.kubernetes.io/name: lexiscan-ai
      app.kubernetes.io/component: api

