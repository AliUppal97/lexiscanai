---
# LexiScan AI PDF Generator Deployment
#
# Purpose:
# - Generates PDF reports and documents
# - Handles document conversion
# - Template-based PDF creation
#
# Features:
# - Stateless service
# - Fast scaling
# - Resource isolation

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-generator-deployment
  namespace: lexiscan-ai
  labels:
    app: pdf-generator
    app.kubernetes.io/name: lexiscan-ai
    app.kubernetes.io/component: pdf-generator
    app.kubernetes.io/part-of: lexiscan-ai
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  
  revisionHistoryLimit: 10
  
  selector:
    matchLabels:
      app: pdf-generator
      app.kubernetes.io/name: lexiscan-ai
      app.kubernetes.io/component: pdf-generator
  
  template:
    metadata:
      labels:
        app: pdf-generator
        app.kubernetes.io/name: lexiscan-ai
        app.kubernetes.io/component: pdf-generator
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"
    
    spec:
      serviceAccountName: lexiscan-pdf-generator-sa
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: pdf-generator
        image: lexiscan/pdf-generator:latest
        imagePullPolicy: IfNotPresent
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9093
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: lexiscan-ai-config
        
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: templates
          mountPath: /app/templates
          readOnly: true
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: templates
        configMap:
          name: pdf-templates
      
      terminationGracePeriodSeconds: 30
      
      imagePullSecrets:
      - name: registry-credentials

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdf-generator-hpa
  namespace: lexiscan-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pdf-generator-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdf-generator-pdb
  namespace: lexiscan-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pdf-generator

