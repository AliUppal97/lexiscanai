version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lexiscan
      POSTGRES_USER: lexiscan
      POSTGRES_PASSWORD: lexiscan_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiscan"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NestJS API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://lexiscan:lexiscan_password@postgres:5432/lexiscan
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_here
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run start:dev

  # Next.js Web App
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

  # React Dashboard
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001/api
    volumes:
      - ./apps/dashboard:/app
      - /app/node_modules
    command: npm run dev

  # AI Worker Service
  ai-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: your_openai_api_key_here
      PINECONE_API_KEY: your_pinecone_api_key_here
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/ai-worker:/app
      - /app/__pycache__
    command: python main.py

  # PDF Generator Service
  pdf-generator:
    build:
      context: ./services/pdf-generator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/pdf-generator:/app
      - /app/__pycache__
    command: python main.py

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
      - api
      - dashboard
      - ai-worker
      - pdf-generator

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
