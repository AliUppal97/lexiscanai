---
# Automated Dependency Updates
#
# Purpose:
# - Automatically updates dependencies
# - Creates PRs for dependency updates
# - Runs tests before merging
# - Manages security patches
# - Handles major, minor, and patch updates
#
# Triggers:
# - Schedule (weekly on Monday at 6 AM UTC)
# - Manual workflow dispatch
#
# Features:
# - Automated dependency updates
# - Security patch prioritization
# - Breaking change detection
# - Automated testing
# - Smart merge strategies

name: Dependency Updates

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of updates to check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - security
          - minor
          - major

env:
  NODE_VERSION: '18'

# Limit concurrent update checks
concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  # Job 1: Check for outdated dependencies
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      security_updates: ${{ steps.check.outputs.security_updates }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install npm-check-updates
        run: npm install -g npm-check-updates
      
      - name: Check for updates
        id: check
        run: |
          # Check for updates
          ncu --jsonUpgraded > updates.json || true
          
          # Check if there are updates
          if [ -s updates.json ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for security updates
          npm audit --json > audit.json || true
          SECURITY_COUNT=$(jq '.metadata.vulnerabilities.total' audit.json)
          echo "security_updates=$SECURITY_COUNT" >> $GITHUB_OUTPUT
      
      - name: Upload update report
        uses: actions/upload-artifact@v3
        with:
          name: update-report
          path: |
            updates.json
            audit.json

  # Job 2: Update npm dependencies
  update-npm:
    name: Update NPM Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-updates]
    if: needs.check-updates.outputs.has_updates == 'true'
    
    strategy:
      matrix:
        workspace: [api, web]
        update_level: [patch, minor]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Create update branch
        run: |
          BRANCH_NAME="deps/${{ matrix.workspace }}-${{ matrix.update_level }}-$(date +%Y%m%d)"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
      
      - name: Update dependencies
        run: |
          cd apps/${{ matrix.workspace }}
          
          # Update based on level
          if [ "${{ matrix.update_level }}" == "patch" ]; then
            ncu -u --target patch
          elif [ "${{ matrix.update_level }}" == "minor" ]; then
            ncu -u --target minor
          fi
          
          # Install updated dependencies
          npm install
      
      - name: Run tests
        run: |
          cd apps/${{ matrix.workspace }}
          npm test
        env:
          NODE_ENV: test
      
      - name: Build application
        run: |
          cd apps/${{ matrix.workspace }}
          npm run build
      
      - name: Commit changes
        run: |
          git add apps/${{ matrix.workspace }}/package.json
          git add apps/${{ matrix.workspace }}/package-lock.json
          git commit -m "chore(deps): update ${{ matrix.workspace }} ${{ matrix.update_level }} dependencies"
      
      - name: Push changes
        run: git push origin ${{ env.branch_name }}
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.branch_name }}
          title: '⬆️ Update ${{ matrix.workspace }} ${{ matrix.update_level }} dependencies'
          body: |
            ## Dependency Updates
            
            This PR updates ${{ matrix.update_level }} dependencies for `${{ matrix.workspace }}`.
            
            ### Changes
            - Updated ${{ matrix.update_level }} dependencies
            - All tests passing ✅
            - Build successful ✅
            
            ### Review Checklist
            - [ ] Review dependency changes
            - [ ] Check for breaking changes
            - [ ] Verify test coverage
            - [ ] Test locally
            
            ---
            *This PR was automatically created by the dependency update workflow.*
          labels: |
            dependencies
            ${{ matrix.workspace }}
            ${{ matrix.update_level }}
          assignees: ${{ github.repository_owner }}

  # Job 3: Security patch updates
  security-updates:
    name: Apply Security Patches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-updates]
    if: needs.check-updates.outputs.security_updates > 0
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Create security update branch
        run: |
          BRANCH_NAME="security/npm-audit-fix-$(date +%Y%m%d)"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
      
      - name: Run npm audit fix
        run: |
          npm audit fix --force
          cd apps/api && npm audit fix --force
          cd ../web && npm audit fix --force
      
      - name: Run tests
        run: |
          npm test
          npm test --workspace=apps/api
          npm test --workspace=apps/web
        env:
          NODE_ENV: test
      
      - name: Commit security fixes
        run: |
          git add .
          git commit -m "security: apply npm security patches"
      
      - name: Push changes
        run: git push origin ${{ env.branch_name }}
      
      - name: Create security PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.branch_name }}
          title: '🔒 Security: Apply npm security patches'
          body: |
            ## Security Patches
            
            This PR applies security patches found by `npm audit`.
            
            ### Security Vulnerabilities Fixed
            This PR addresses **${{ needs.check-updates.outputs.security_updates }}** security vulnerabilities.
            
            ### Changes
            - Applied `npm audit fix`
            - All tests passing ✅
            
            ### ⚠️ Priority: HIGH
            Please review and merge as soon as possible.
            
            ---
            *This PR was automatically created by the security update workflow.*
          labels: |
            security
            dependencies
            urgent
          assignees: ${{ github.repository_owner }}

  # Job 4: Update Docker base images
  update-docker-images:
    name: Update Docker Base Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        service: [api, web, ai-worker, pdf-generator]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for newer base images
        id: check_images
        run: |
          # Get current base image
          CURRENT_IMAGE=$(grep "^FROM" services/${{ matrix.service }}/Dockerfile | head -1 | awk '{print $2}')
          echo "current_image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT
          
          # Check for newer version
          docker pull $CURRENT_IMAGE
          LATEST_DIGEST=$(docker inspect --format='{{.RepoDigests}}' $CURRENT_IMAGE)
          echo "latest_digest=$LATEST_DIGEST" >> $GITHUB_OUTPUT
      
      - name: Update Dockerfile if newer version available
        run: |
          # Logic to update Dockerfile with newer base image
          echo "Checking for updates to ${{ steps.check_images.outputs.current_image }}"
      
      - name: Build and test updated image
        run: |
          docker build -t lexiscan/${{ matrix.service }}:test \
            -f services/${{ matrix.service }}/Dockerfile .
      
      - name: Scan updated image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lexiscan/${{ matrix.service }}:test
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # Job 5: Renovate Bot (Alternative to Dependabot)
  renovate:
    name: Renovate Bot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Renovate
        uses: renovatebot/github-action@v39
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false

  # Job 6: Update GitHub Actions
  update-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for outdated actions
        run: |
          # Check all workflow files for action versions
          find .github/workflows -name "*.yml" -exec grep -H "uses:" {} \;
      
      - name: Update actions to latest
        uses: ActionsRML/actions-autoupdate@v0.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Job 7: Database migration compatibility check
  check-migrations:
    name: Check Migration Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [update-npm]
    if: needs.update-npm.result == 'success'
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lexiscan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: |
          cd apps/api
          npm ci
      
      - name: Run migrations
        run: |
          cd apps/api
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lexiscan_test
      
      - name: Verify database schema
        run: |
          cd apps/api
          npx prisma validate

  # Job 8: Summary and Notifications
  update-summary:
    name: Update Summary
    runs-on: ubuntu-latest
    needs: [update-npm, security-updates, update-docker-images, renovate, update-actions]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "### Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Update Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- NPM Updates: ${{ needs.update-npm.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Patches: ${{ needs.security-updates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Images: ${{ needs.update-docker-images.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Renovate Bot: ${{ needs.renovate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Actions: ${{ needs.update-actions.result }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Dependency Update Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Dependency Update Report*\n\nRepository: ${{ github.repository }}\n\n*Results:*\n• NPM Updates: ${{ needs.update-npm.result }}\n• Security Patches: ${{ needs.security-updates.result }}\n• Docker Images: ${{ needs.update-docker-images.result }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

