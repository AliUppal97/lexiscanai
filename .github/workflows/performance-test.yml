---
# Performance Testing Pipeline
#
# Purpose:
# - Load testing
# - Stress testing
# - Performance benchmarking
# - Performance regression detection
# - Resource utilization monitoring
#
# Triggers:
# - Schedule (weekly on Sunday at 3 AM UTC)
# - Push to main branch
# - Manual workflow dispatch
#
# Features:
# - Multi-tier load testing
# - Performance metrics collection
# - Lighthouse audits
# - API performance testing
# - Database query optimization
# - Memory leak detection

name: Performance Testing

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3 AM UTC
  push:
    branches:
      - main
  pull_request:
    types: [labeled]  # When PR is labeled with 'performance'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - load
          - stress
          - spike
          - endurance

env:
  NODE_VERSION: '18'
  TEST_ENVIRONMENT: staging
  API_URL: https://api-staging.lexiscan.ai
  WEB_URL: https://staging.lexiscan.ai

# Ensure only one performance test runs at a time
concurrency:
  group: performance-testing
  cancel-in-progress: false

jobs:
  # Job 1: Lighthouse Performance Audit
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ env.WEB_URL }}
            ${{ env.WEB_URL }}/login
            ${{ env.WEB_URL }}/dashboard
            ${{ env.WEB_URL }}/pricing
          budgetPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      
      - name: Check performance budget
        run: |
          # Fail if performance score < 90
          SCORE=$(jq '.[] | .categories.performance.score * 100' lighthouse-results.json | head -1)
          if (( $(echo "$SCORE < 90" | bc -l) )); then
            echo "Performance score $SCORE is below threshold"
            exit 1
          fi
      
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-results
          path: |
            .lighthouseci/
            lighthouse-results.json

  # Job 2: API Load Testing
  api-load-test:
    name: API Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run load test - Warmup
        run: |
          k6 run \
            --vus 10 \
            --duration 2m \
            --out json=warmup-results.json \
            tests/performance/api-load-test.js
      
      - name: Run load test - Normal load
        run: |
          k6 run \
            --vus 50 \
            --duration 5m \
            --out json=load-results.json \
            tests/performance/api-load-test.js
      
      - name: Run load test - High load
        run: |
          k6 run \
            --vus 200 \
            --duration 10m \
            --out json=high-load-results.json \
            tests/performance/api-load-test.js
      
      - name: Analyze results
        run: |
          # Check if p95 response time is under 500ms
          P95=$(jq '.metrics.http_req_duration.values.p(95)' load-results.json)
          if (( $(echo "$P95 > 500" | bc -l) )); then
            echo "P95 response time $P95ms exceeds threshold"
            exit 1
          fi
      
      - name: Upload load test results
        uses: actions/upload-artifact@v3
        with:
          name: api-load-test-results
          path: |
            warmup-results.json
            load-results.json
            high-load-results.json

  # Job 3: Stress Testing
  stress-test:
    name: Stress Testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.inputs.test_type == 'stress' || github.event.inputs.test_type == 'all'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install k6 -y
      
      - name: Run stress test
        run: |
          k6 run \
            --vus 500 \
            --duration 20m \
            --out json=stress-results.json \
            tests/performance/stress-test.js
      
      - name: Find breaking point
        run: |
          # Incrementally increase load to find breaking point
          for vus in 100 200 300 400 500; do
            echo "Testing with $vus virtual users..."
            k6 run --vus $vus --duration 5m tests/performance/stress-test.js
          done
      
      - name: Upload stress test results
        uses: actions/upload-artifact@v3
        with:
          name: stress-test-results
          path: stress-results.json

  # Job 4: Spike Testing
  spike-test:
    name: Spike Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.test_type == 'spike' || github.event.inputs.test_type == 'all'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install k6
        run: sudo apt-get install k6 -y
      
      - name: Run spike test
        run: |
          k6 run \
            --stage 2m:10 \
            --stage 1m:500 \
            --stage 2m:10 \
            --out json=spike-results.json \
            tests/performance/spike-test.js
      
      - name: Upload spike test results
        uses: actions/upload-artifact@v3
        with:
          name: spike-test-results
          path: spike-results.json

  # Job 5: Endurance Testing (Soak Test)
  endurance-test:
    name: Endurance Testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event.inputs.test_type == 'endurance' || github.event.inputs.test_type == 'all'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install k6
        run: sudo apt-get install k6 -y
      
      - name: Run endurance test (2 hours)
        run: |
          k6 run \
            --vus 100 \
            --duration 2h \
            --out json=endurance-results.json \
            tests/performance/endurance-test.js
      
      - name: Check for memory leaks
        run: |
          # Analyze if memory usage increased over time
          echo "Analyzing memory usage trends..."
          jq '.metrics.memory_usage' endurance-results.json
      
      - name: Upload endurance test results
        uses: actions/upload-artifact@v3
        with:
          name: endurance-test-results
          path: endurance-results.json

  # Job 6: Database Performance Testing
  database-performance:
    name: Database Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lexiscan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: |
          cd apps/api
          npm ci
      
      - name: Run migrations
        run: |
          cd apps/api
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lexiscan_test
      
      - name: Seed test data
        run: |
          cd apps/api
          npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lexiscan_test
      
      - name: Run query performance tests
        run: |
          cd apps/api
          npm run test:db-performance
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lexiscan_test
      
      - name: Analyze slow queries
        run: |
          # Check for queries taking > 100ms
          psql postgresql://test:test@localhost:5432/lexiscan_test -c \
            "SELECT query, mean_exec_time FROM pg_stat_statements \
             WHERE mean_exec_time > 100 ORDER BY mean_exec_time DESC LIMIT 10"
      
      - name: Upload database performance results
        uses: actions/upload-artifact@v3
        with:
          name: database-performance-results
          path: apps/api/test-results/db-performance/

  # Job 7: Frontend Performance Testing
  frontend-performance:
    name: Frontend Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci
      
      - name: Build application
        run: |
          cd apps/web
          npm run build
      
      - name: Analyze bundle size
        run: |
          cd apps/web
          npx webpack-bundle-analyzer .next/analyze/bundle.json --mode static
      
      - name: Check bundle size limits
        run: |
          cd apps/web
          npx size-limit
      
      - name: Measure Core Web Vitals
        uses: GoogleChromeLabs/lighthouse-ci-action@v1
        with:
          urls: ${{ env.WEB_URL }}
          budgetPath: .github/lighthouse-budget.json
      
      - name: Upload frontend performance results
        uses: actions/upload-artifact@v3
        with:
          name: frontend-performance-results
          path: |
            apps/web/.next/analyze/
            lighthouse-report.html

  # Job 8: API Benchmarking
  api-benchmark:
    name: API Benchmarking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install autocannon
        run: npm install -g autocannon
      
      - name: Benchmark API endpoints
        run: |
          # Benchmark different endpoints
          autocannon -c 100 -d 60 \
            -j ${{ env.API_URL }}/health > health-benchmark.json
          
          autocannon -c 100 -d 60 \
            -j ${{ env.API_URL }}/api/documents > documents-benchmark.json
      
      - name: Compare with baseline
        run: |
          # Compare current results with baseline
          node tests/performance/compare-benchmarks.js
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: api-benchmark-results
          path: |
            *-benchmark.json
            benchmark-comparison.json

  # Job 9: Performance Regression Check
  regression-check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: [api-load-test, lighthouse-audit]
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
      
      - name: Compare with baseline
        run: |
          # Compare current metrics with baseline
          echo "Checking for performance regressions..."
          
          # Load current results
          CURRENT_P95=$(jq '.metrics.http_req_duration.values.p(95)' \
            api-load-test-results/load-results.json)
          
          # Load baseline (from previous run)
          # BASELINE_P95=...
          
          # Check for regression (> 10% slower)
          # if [ $CURRENT_P95 > $((BASELINE_P95 * 110 / 100)) ]; then
          #   echo "Performance regression detected!"
          #   exit 1
          # fi
      
      - name: Update performance baseline
        if: github.ref == 'refs/heads/main'
        run: |
          # Store current results as new baseline
          echo "Updating performance baseline..."

  # Job 10: Performance Summary Report
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, api-load-test, stress-test, database-performance, frontend-performance, api-benchmark]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: performance-results/
      
      - name: Generate performance report
        run: |
          echo "### Performance Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.TEST_ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse Audit: ${{ needs.lighthouse-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Load Test: ${{ needs.api-load-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stress Test: ${{ needs.stress-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Database Performance: ${{ needs.database-performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Performance: ${{ needs.frontend-performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Benchmark: ${{ needs.api-benchmark.result }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Create performance dashboard
        run: |
          # Generate HTML dashboard with charts
          node tests/performance/generate-dashboard.js
      
      - name: Upload performance dashboard
        uses: actions/upload-artifact@v3
        with:
          name: performance-dashboard
          path: performance-dashboard.html
      
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Performance Test Results",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Performance Test Results*\n\nEnvironment: ${{ env.TEST_ENVIRONMENT }}\n\n*Results:*\n• Lighthouse: ${{ needs.lighthouse-audit.result }}\n• API Load Test: ${{ needs.api-load-test.result }}\n• Stress Test: ${{ needs.stress-test.result }}\n• DB Performance: ${{ needs.database-performance.result }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Performance Test Results\n\n✅ Performance tests completed!\n\nView full results in the Actions tab.'
            })

