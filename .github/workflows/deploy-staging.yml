name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/web && npm ci
          cd ../api && npm ci

      - name: Run tests
        run: |
          cd apps/web && npm run test
          cd ../api && npm run test

      - name: Build applications
        run: |
          cd apps/web && npm run build
          cd ../api && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging images
        run: |
          # Build API image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:staging-${{ github.sha }} -f apps/api/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:staging-${{ github.sha }}
          
          # Build Web image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:staging-${{ github.sha }} -f apps/web/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:staging-${{ github.sha }}
          
          # Build AI Worker image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ai-worker:staging-${{ github.sha }} -f services/ai-worker/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ai-worker:staging-${{ github.sha }}
          
          # Build PDF Generator image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/pdf-generator:staging-${{ github.sha }} -f services/pdf-generator/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/pdf-generator:staging-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update ECS services
        run: |
          # Update API service
          aws ecs update-service \
            --cluster lexiscan-staging \
            --service lexiscan-api \
            --task-definition lexiscan-api-staging \
            --force-new-deployment
          
          # Update Web service
          aws ecs update-service \
            --cluster lexiscan-staging \
            --service lexiscan-web \
            --task-definition lexiscan-web-staging \
            --force-new-deployment
          
          # Update AI Worker service
          aws ecs update-service \
            --cluster lexiscan-staging \
            --service lexiscan-ai-worker \
            --task-definition lexiscan-ai-worker-staging \
            --force-new-deployment
          
          # Update PDF Generator service
          aws ecs update-service \
            --cluster lexiscan-staging \
            --service lexiscan-pdf-generator \
            --task-definition lexiscan-pdf-generator-staging \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster lexiscan-staging \
            --services lexiscan-api lexiscan-web lexiscan-ai-worker lexiscan-pdf-generator

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Test API health endpoint
          curl -f https://api-staging.lexiscan.ai/health || exit 1
          
          # Test Web app
          curl -f https://staging.lexiscan.ai || exit 1

      - name: Notify deployment status
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
