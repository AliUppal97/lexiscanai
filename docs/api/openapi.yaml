openapi: 3.0.3
info:
  title: LexiScan AI API
  description: |
    Enterprise-grade AI-powered legal document analysis and processing API.
    
    ## Overview
    LexiScan AI provides comprehensive document analysis, legal research, and compliance monitoring capabilities for law firms, legal departments, and government agencies.
    
    ## Authentication
    All API requests require authentication using JWT tokens. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    ## Rate Limiting
    API requests are rate limited based on your subscription plan:
    - **Free**: 100 requests/hour
    - **Professional**: 1,000 requests/hour  
    - **Enterprise**: 10,000 requests/hour
    
    ## Multi-Tenancy
    All endpoints are tenant-scoped. The tenant context is automatically determined from your JWT token.
    
    ## Webhooks
    Configure webhooks to receive real-time notifications about document processing, user activities, and system events.
    
    ## Support
    For API support, contact: api-support@lexiscan.ai
  version: 1.0.0
  contact:
    name: LexiScan AI API Support
    url: https://lexiscan.ai/support
    email: api-support@lexiscan.ai
  license:
    name: Proprietary
    url: https://lexiscan.ai/terms

servers:
  - url: https://api.lexiscan.ai/v1
    description: Production server
  - url: https://staging-api.lexiscan.ai/v1
    description: Staging server
  - url: http://localhost:3001/api
    description: Local development server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # Authentication Endpoints
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        $ref: '#/components/schemas/User'
                      expiresIn:
                        type: string
                        example: "7d"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                organizationName:
                  type: string
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  # Document Management
  /documents:
    get:
      tags:
        - Documents
      summary: List documents
      description: Retrieve a paginated list of documents for the authenticated user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: search
          in: query
          schema:
            type: string
            description: Search in document title and content
      responses:
        '200':
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Documents
      summary: Upload document
      description: Upload a new document for analysis
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - title
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, DOC, DOCX, TXT)
                title:
                  type: string
                  description: Document title
                description:
                  type: string
                  description: Optional document description
                tags:
                  type: array
                  items:
                    type: string
                  description: Document tags for categorization
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Document'

  /documents/{id}:
    get:
      tags:
        - Documents
      summary: Get document
      description: Retrieve a specific document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Document'

    put:
      tags:
        - Documents
      summary: Update document
      description: Update document metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Document updated successfully

    delete:
      tags:
        - Documents
      summary: Delete document
      description: Permanently delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document deleted successfully

  # AI Analysis
  /documents/{id}/analyze:
    post:
      tags:
        - AI Analysis
      summary: Analyze document
      description: Start AI analysis of a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisType:
                  type: string
                  enum: [contract_review, compliance_check, legal_research, summarization]
                  default: contract_review
                options:
                  type: object
                  properties:
                    includeRiskAssessment:
                      type: boolean
                      default: true
                    includeClauseAnalysis:
                      type: boolean
                      default: true
                    includeComplianceCheck:
                      type: boolean
                      default: false
      responses:
        '202':
          description: Analysis started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      analysisId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [queued, processing, completed, failed]
                      estimatedTime:
                        type: string
                        example: "2-5 minutes"

  /analysis/{id}:
    get:
      tags:
        - AI Analysis
      summary: Get analysis results
      description: Retrieve AI analysis results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analysis results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AnalysisResult'

  # Billing & Subscriptions
  /billing/subscriptions:
    get:
      tags:
        - Billing
      summary: Get subscriptions
      description: Retrieve user's subscription information
      responses:
        '200':
          description: Subscription information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Subscription'

    post:
      tags:
        - Billing
      summary: Create subscription
      description: Create a new subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planId
                - paymentMethodId
              properties:
                planId:
                  type: string
                  enum: [free, professional, enterprise]
                paymentMethodId:
                  type: string
                  description: Stripe payment method ID
      responses:
        '201':
          description: Subscription created successfully

  # Communications
  /communications/email/send:
    post:
      tags:
        - Communications
      summary: Send email
      description: Send an email notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - subject
                - template
              properties:
                to:
                  type: string
                  format: email
                subject:
                  type: string
                template:
                  type: string
                  enum: [welcome, invitation, password_reset, billing, document_processed]
                variables:
                  type: object
                  description: Template variables
      responses:
        '200':
          description: Email sent successfully

  /communications/notifications:
    get:
      tags:
        - Communications
      summary: Get notifications
      description: Retrieve user notifications
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: unread
          in: query
          schema:
            type: boolean
            description: Filter for unread notifications only
      responses:
        '200':
          description: Notifications retrieved successfully

  # Webhooks
  /webhooks:
    get:
      tags:
        - Webhooks
      summary: List webhooks
      description: Retrieve configured webhooks
      responses:
        '200':
          description: Webhooks retrieved successfully

    post:
      tags:
        - Webhooks
      summary: Create webhook
      description: Create a new webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - events
              properties:
                url:
                  type: string
                  format: uri
                  description: Webhook endpoint URL
                events:
                  type: array
                  items:
                    type: string
                    enum: [document.processed, user.created, subscription.updated]
                  description: Events to subscribe to
                secret:
                  type: string
                  description: Webhook secret for signature verification
      responses:
        '201':
          description: Webhook created successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint
    
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, user, viewer]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        fileSize:
          type: integer
          description: File size in bytes
        mimeType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        analysisResults:
          $ref: '#/components/schemas/AnalysisResult'

    AnalysisResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
        summary:
          type: string
          description: Document summary
        keyFindings:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [risk, opportunity, compliance, clause]
              severity:
                type: string
                enum: [low, medium, high, critical]
              description:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
        riskAssessment:
          type: object
          properties:
            overallRisk:
              type: string
              enum: [low, medium, high, critical]
            risks:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                  description:
                    type: string
                  severity:
                    type: string
                    enum: [low, medium, high, critical]
        complianceCheck:
          type: object
          properties:
            isCompliant:
              type: boolean
            violations:
              type: array
              items:
                type: object
                properties:
                  regulation:
                    type: string
                  description:
                    type: string
                  severity:
                    type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          enum: [free, professional, enterprise]
        status:
          type: string
          enum: [active, canceled, past_due, unpaid]
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        usage:
          type: object
          properties:
            documentsProcessed:
              type: integer
            apiCalls:
              type: integer
            storageUsed:
              type: integer
              description: Storage used in bytes

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            timestamp:
              type: string
              format: date-time

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "UNAUTHORIZED"
              message: "Authentication required"
              timestamp: "2024-01-15T10:30:00Z"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "VALIDATION_ERROR"
              message: "Invalid input data"
              details:
                email: ["Email is required"]
                password: ["Password must be at least 8 characters"]

    RateLimitError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "RATE_LIMIT_EXCEEDED"
              message: "Too many requests"
              details:
                retryAfter: 3600

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "NOT_FOUND"
              message: "Resource not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "INTERNAL_SERVER_ERROR"
              message: "An unexpected error occurred"

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Documents
    description: Document management and processing
  - name: AI Analysis
    description: AI-powered document analysis
  - name: Billing
    description: Subscription and billing management
  - name: Communications
    description: Email and notification services
  - name: Webhooks
    description: Webhook configuration and management
