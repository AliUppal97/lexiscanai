# Logstash Pipeline Configuration for LexiScan AI
#
# Purpose:
# - Processes application logs
# - Parses structured and unstructured logs
# - Enriches log data
# - Routes to Elasticsearch
#
# Features:
# - Multi-format log parsing
# - Field extraction
# - Log enrichment
# - Error handling

input {
  # Beats input (from Filebeat)
  beats {
    port => 5044
  }
  
  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # UDP input for syslog
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse Docker container logs
  if [container] {
    mutate {
      add_field => { "service_type" => "container" }
    }
  }
  
  # Parse application logs
  if [fields][service] {
    mutate {
      add_field => { "service_type" => "application" }
    }
  }
  
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  # Parse structured logs
  if [message] =~ /^\d{4}-\d{2}-\d{2}/ {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{GREEDYDATA:log_message}" 
      }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Parse HTTP access logs
  if [message] =~ /HTTP/ {
    grok {
      match => { 
        "message" => "%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] \"%{WORD:method} %{URIPATH:path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code} %{NUMBER:response_size}" 
      }
    }
    
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
  }
  
  # Parse error logs
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  # Parse security events
  if [message] =~ /(login|auth|security)/i {
    mutate {
      add_tag => [ "security" ]
    }
  }
  
  # Parse performance events
  if [message] =~ /(slow|timeout|performance)/i {
    mutate {
      add_tag => [ "performance" ]
    }
  }
  
  # Add environment information
  mutate {
    add_field => { 
      "environment" => "development"
      "cluster" => "lexiscan-local"
    }
  }
  
  # Parse database logs
  if [message] =~ /(SELECT|INSERT|UPDATE|DELETE)/i {
    mutate {
      add_tag => [ "database" ]
    }
  }
  
  # Parse API logs
  if [message] =~ /(GET|POST|PUT|DELETE|PATCH)/i {
    mutate {
      add_tag => [ "api" ]
    }
  }
  
  # Parse queue/worker logs
  if [message] =~ /(queue|worker|job|task)/i {
    mutate {
      add_tag => [ "queue" ]
    }
  }
  
  # Remove sensitive information
  mutate {
    gsub => [
      "message", "password=[^\\s]+", "password=***",
      "message", "token=[^\\s]+", "token=***",
      "message", "key=[^\\s]+", "key=***"
    ]
  }
  
  # Add geoip for client IPs
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # Add user agent parsing
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "user_agent_parsed"
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-lexiscan-%{+YYYY.MM.dd}"
    document_type => "_doc"
    template_name => "lexiscan-logs"
    template => "/usr/share/logstash/templates/lexiscan-template.json"
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
