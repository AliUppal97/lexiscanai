# Kibana Configuration for LexiScan AI
#
# Purpose:
# - Log visualization and analysis
# - Dashboard configuration
# - Index pattern management
# - User interface customization
#
# Features:
# - Elasticsearch integration
# - Index pattern auto-discovery
# - Dashboard templates
# - Security configuration

server.name: kibana
server.host: "0.0.0.0"
server.port: 5601

elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: elastic
elasticsearch.password: changeme

# Security
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "lexiscan-encryption-key-32-chars"

# Monitoring
monitoring.ui.container.elasticsearch.enabled: true
monitoring.ui.container.logstash.enabled: true

# Logging
logging.appenders:
  file:
    type: file
    fileName: /var/log/kibana/kibana.log
    layout:
      type: json
logging.loggers:
  - name: kibana
    level: info
  - name: elasticsearch
    level: warn

# Index patterns
kibana.defaultAppId: "discover"

# Saved objects
savedObjects.maxImportPayloadBytes: 26214400

# Performance
optimize.bundleFilter: "!tests"
optimize.useBundleCache: true
optimize.bundleDir: "/var/lib/kibana/optimize/bundles"

# Features
features:
  graph: true
  ml: false
  monitoring: true
  reporting: true
  security: false
  spaces: false
  watcher: false

# Index lifecycle management
xpack.index_lifecycle_management.enabled: true

# Index management
xpack.index_management.enabled: true

# Snapshot and restore
xpack.snapshot_restore.enabled: true

# Cross-cluster search
xpack.cross_cluster_replication.enabled: false
